        <div class="login-title">Welcome back</div>
        <form (ngSubmit)="onSubmit()" #loginForm="ngForm" novalidate>
            <div class="login-field-group">
                <label for="email" class="login-label">Phone Number</label>
                <input id="email" name="email" type="email" class="login-input" [(ngModel)]="email" required email [ngClass]="{ 'login-input-error': submitted && !loginForm.controls['email']?.valid }" />
                <div *ngIf="submitted && loginForm.controls['email']?.invalid" class="login-error">Email is required</div>
            </div>
            <div class="login-field-group">
                <label for="password" class="login-label">Password</label>
                <input id="password" name="password" type="password" class="login-input" [(ngModel)]="password" required minlength="6" [ngClass]="{ 'login-input-error': submitted && !loginForm.controls['password']?.valid }" />
                <div *ngIf="submitted && loginForm.controls['password']?.invalid" class="login-error">Password is required</div>
            </div>
            <button type="submit" class="login-btn">Log In</button>
        </form>
    </div>
</div>
